name: Publish addons branch

# Consumers mount this repository under their `modules/` directory as a git submodule so the
# module at the repo root lands on Odoo's addons path. They must NOT track `main`: it carries the
# OCB submodule (`odoo/`, only needed here for local development and the test check), and a
# consumer built with odoo-nix (`self.submodules = true`) would recurse into that gitlink and
# fetch a second 2 GB copy of OCB — or fail on an uninitialised one.
#
# So every push to main that touches the module is mirrored onto an `addons` branch holding just
# the addon, the licence and the README, with no .gitmodules. Consumers pin
# `branch = addons`. The branch has a linear history and is never force-pushed, so submodule
# pointers keep resolving.
on:
  push:
    branches:
      - main
    paths:
      - 'mail_cloudflare/**'
      - 'LICENSE'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/addons-branch.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync the module into the addons branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git fetch origin addons; then
            git worktree add ../addons origin/addons
            git -C ../addons checkout -B addons
          else
            git worktree add --orphan -b addons ../addons
          fi

          rsync -a --delete --exclude .git \
            mail_cloudflare LICENSE README.md CHANGELOG.md ../addons/

          cd ../addons
          git add -A
          if git diff --cached --quiet; then
            echo "addons branch already up to date"
          else
            git commit -m "addons: sync from ${GITHUB_SHA}"
            git push origin addons
          fi
